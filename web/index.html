<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Building Our Better Angels — Orientation Surface</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="glass">
    <div class="logo-area">
      <div class="logo-circle"></div>
      <h1>Building Our Better Angels</h1>
      <span>thin-cut 260710</span>
    </div>
    <div class="reader-metadata" id="global-status">
      Invitation spine · Salon for comments · Local-first
    </div>
  </header>

  <div class="workspace">
    <aside class="glass">
      <div class="resonator-box">
        <div class="resonator-input-wrapper">
          <span class="resonator-icon">🕯️</span>
          <input type="text" id="resonator-search" class="resonator-input" placeholder="Hold a thought to resonate...">
        </div>
      </div>

      <!-- Nav built from public-allowlist.json -->
      <div id="nav-root"></div>

      <div class="nav-section" style="margin-top: auto; border-top: 1px solid var(--border-color); padding-top: 20px;">
        <div class="nav-section-title">Floor</div>
        <ul class="nav-list" style="font-family: var(--font-mono); font-size: 11px; padding: 0 10px;">
          <li style="color: var(--text-muted); margin-bottom: 6px;">Salon overlay (bottom-right) — real floor, not mock</li>
          <li style="color: var(--text-secondary);">Writes need <code>salon-serve</code></li>
          <li style="color: var(--accent-amber); font-weight: 500;">Durable survival → Porter + triage</li>
        </ul>
      </div>
    </aside>

    <main>
      <div class="reader-header">
        <div class="reader-metadata" id="document-lineage">select a document</div>
        <div class="reader-metadata" id="document-status">public allowlist</div>
      </div>
      <div class="reader-canvas">
        <article class="markdown" id="content-canvas"></article>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
  <script src="salon.js"></script>
</body>
</html>
